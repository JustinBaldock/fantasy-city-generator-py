# Runs the tests on every push and pull request, on Linux, macOS and
# Windows, so a change that breaks something shows a red cross on GitHub.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:  # Lets you start a run by hand from the Actions tab.

# A newer push to the same branch replaces a run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false  # Finish every run, to see everywhere it fails.
      matrix:
        include:
          # The oldest Python the README promises, the one used day to day,
          # and the newest.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    env:
      # Qt draws without a screen.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the app and test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest -q
